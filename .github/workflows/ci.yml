# CI Workflow for Council Bridge
# Runs on push and pull_request to ensure code quality and correctness
# Includes regression test verification for:
# - Runtime concurrency tests (P3-01)
# - Nonce store tests (M3-004)
# - Authentication flows
# - Delivery operations
# - Migration scenarios

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'P2-*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'P2-*.md'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests (including runtime concurrency)
        run: npm run test:integration

      - name: Run security tests (M3-004 nonce tests, auth flows)
        run: npm run test:security

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime concurrency (P3-01)
        run: npx tsx --test tests/integration/runtime-concurrency.test.ts --test-name-pattern "Scenario"

      - name: Verify nonce store (M3-004)
        run: npx tsx --test tests/security/M3-004-nonces.test.ts

      - name: Verify founder authorization
        run: npx tsx --test tests/security/M3-004-founder-authorization.test.ts

      - name: Verify deliverable operations
        run: npx tsx --test tests/unit/phase9_deliverable.test.ts

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test, regression-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build