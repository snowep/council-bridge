                - link "[96]" [ref=e820] [cursor=pointer]:
                  - /url: "#cite_note-96"
              - text: On the March 2020 launch of his collaboration with Japanese streetwear designer
              - link "Nigo" [ref=e822] [cursor=pointer]:
