            - paragraph [ref=e161]:
              - text: Virgil Abloh (
              - link "/ˈæbloʊ/" [ref=e164] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Help:IPA/English
                - text: /
                - generic [ref=e165]: ˈæbloʊ
                - text: /
              - text: ; September 30, 1980 – November 28, 2021) was an American
              - link "fashion designer" [ref=e166] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fashion_design
              - text: and entrepreneur. A trained architect, Abloh founded his own line of luxury
              - link "streetwear" [ref=e167] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Streetwear
              - text: clothing under the moniker Pyrex Vision in 2012, which he transformed into the
              - link "Milan" [ref=e168] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Milan
              - text: based fashion label
              - link "Off-White" [ref=e169] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Off-White_(company)
              - text: in 2013. Abloh was appointed
              - link "artistic director" [ref=e170] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artistic_director
              - text: of
              - link "Louis Vuitton" [ref=e171] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Louis_Vuitton
              - text: "'s menswear collection beginning in 2018 and was given increased creative responsibilities across the"
              - link "LVMH" [ref=e172] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/LVMH
              - text: brand in early 2021.
              - superscript [ref=e173]:
                - link "[1]" [ref=e174] [cursor=pointer]:
                  - /url: "#cite_note-Vfreidman-1"
              - text: Abloh worked in
              - link "Chicago" [ref=e176] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chicago
              - link "street fashion" [ref=e177] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Street_fashion
              - text: before he entered the world of international fashion with an internship at
              - link "Fendi" [ref=e178] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fendi
              - text: in 2009, alongside American rapper
              - link "Kanye West" [ref=e179] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kanye_West
              - text: . Abloh assumed the role of creative director at
              - link "Donda" [ref=e180] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Donda_(company)
              - text: ", West's creative agency in 2010."
            - paragraph [ref=e181]:
              - text: When Abloh joined LVMH in 2018, he became the first Ghanaian-American artistic director of a French luxury fashion house.
              - superscript [ref=e182]:
                - link "[1]" [ref=e183] [cursor=pointer]:
                  - /url: "#cite_note-Vfreidman-1"
              - superscript [ref=e185]:
                - link "[2]" [ref=e186] [cursor=pointer]:
                  - /url: "#cite_note-Hyman-2"
              - text: He was named by
              - link "Time" [ref=e189] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Time_(magazine)
              - text: magazine as one of the
              - link "100 most influential people in the world" [ref=e190] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Time_100
              - text: that year.
              - superscript [ref=e191]:
                - link "[3]" [ref=e192] [cursor=pointer]:
                  - /url: "#cite_note-:1-3"
              - text: Abloh's design aesthetic, which bridged
              - link "streetwear" [ref=e194] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Streetwear
              - text: and
              - link "luxury clothing" [ref=e195] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Designer_clothing
              - text: ", was described as transformative by"
              - link "The New York Times" [ref=e197] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_New_York_Times
              - text: .
              - superscript [ref=e198]:
                - link "[4]" [ref=e199] [cursor=pointer]:
                  - /url: "#cite_note-NYTObit-4"
              - text: According to
              - link "The Wall Street Journal" [ref=e202] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Wall_Street_Journal
              - text: ", he reached a level of global fame unusual for a designer,"
              - superscript [ref=e203]:
                - link "[5]" [ref=e204] [cursor=pointer]:
                  - /url: "#cite_note-5"
              - text: and as an influential figure, according to the
              - link "BBC" [ref=e206] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/BBC
              - text: .
              - superscript [ref=e207]:
                - link "[6]" [ref=e208] [cursor=pointer]:
                  - /url: "#cite_note-6"
          - region "Early life and education" [ref=e210]:
            - generic [ref=e211]:
              - heading "Early life and education" [level=2] [ref=e212]
              - link "edit" [ref=e214] [cursor=pointer]:
                - /url: /w/index.php?title=Virgil_Abloh&action=edit&section=1
            - paragraph [ref=e215]:
              - text: Virgil Abloh was born on September 30, 1980, in
              - link "Rockford, Illinois" [ref=e216] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rockford,_Illinois
              - text: ", to"
              - link "Ewe" [ref=e217] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ewe_people
              - text: parents from
              - link "Ghana" [ref=e218] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ghana
              - text: .
              - superscript [ref=e219]:
                - link "[7]" [ref=e220] [cursor=pointer]:
                  - /url: "#cite_note-:0-7"
              - text: His mother was a
              - link "seamstress" [ref=e222] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dressmaker
              - superscript [ref=e223]:
                - link "[8]" [ref=e224] [cursor=pointer]:
                  - /url: "#cite_note-nytimes-8"
              - text: and his father managed a paint company.
              - superscript [ref=e226]:
                - link "[9]" [ref=e227] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: From his mother, he learned how to sew. Abloh was raised in Rockford, where he attended
              - link "Boylan Catholic High School" [ref=e229] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Boylan_Catholic_High_School
              - text: ", graduating in 1998."
              - superscript [ref=e230]:
                - link "[7]" [ref=e231] [cursor=pointer]:
                  - /url: "#cite_note-:0-7"
              - text: He graduated from the
              - link "University of Wisconsin–Madison" [ref=e233] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/University_of_Wisconsin–Madison
              - text: in 2002 with a Bachelor of Science degree in
              - link "civil engineering" [ref=e234] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Civil_engineering
              - text: .
              - superscript [ref=e235]:
                - link "[7]" [ref=e236] [cursor=pointer]:
                  - /url: "#cite_note-:0-7"
              - text: He received his
              - link "Master of Architecture" [ref=e238] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Master_of_Architecture
              - text: at the
              - link "Illinois Institute of Technology" [ref=e239] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Illinois_Institute_of_Technology
              - text: (IIT) in 2006.
              - superscript [ref=e240]:
                - link "[10]" [ref=e241] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - text: When Abloh was attending IIT, there was a building on campus under construction designed by the architect
              - link "Rem Koolhaas" [ref=e243] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rem_Koolhaas
              - text: (who had also worked on runway collections for
              - link "Prada" [ref=e244] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prada
              - text: ). Koolhaas's building helped spark his interest in fashion.
              - superscript [ref=e245]:
                - link "[7]" [ref=e246] [cursor=pointer]:
                  - /url: "#cite_note-:0-7"
              - text: Abloh was further inspired by
              - link "Crown Hall" [ref=e248] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Crown_Hall
              - text: ", designed by"
              - link "Ludwig Mies van der Rohe" [ref=e249] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ludwig_Mies_van_der_Rohe
              - text: .
              - superscript [ref=e250]:
                - link "[11]" [ref=e251] [cursor=pointer]:
                  - /url: "#cite_note-Connor-11"
              - text: Abloh's master's thesis project involved a design for a
              - link "Chicago" [ref=e253] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chicago
              - text: skyscraper, which curved in the direction of
              - link "Lake Michigan" [ref=e254] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Lake_Michigan
              - text: .
              - superscript [ref=e255]:
                - link "[11]" [ref=e256] [cursor=pointer]:
                  - /url: "#cite_note-Connor-11"
              - text: While studying architecture, he also designed T-shirts and wrote on fashion and design for a
              - link "blog" [ref=e258] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Blog
              - text: ", The Brilliance."
              - superscript [ref=e259]:
                - link "[12]" [ref=e260] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - superscript [ref=e262]:
                - link "[13]" [ref=e263] [cursor=pointer]:
                  - /url: "#cite_note-Johnson-13"
              - text: Abloh first met musician
              - link "Kanye West" [ref=e265] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kanye_West
              - text: while working on his designs at a Chicago print shop.
              - superscript [ref=e266]:
                - link "[13]" [ref=e267] [cursor=pointer]:
                  - /url: "#cite_note-Johnson-13"
          - region "Career" [ref=e269]:
            - generic [ref=e270]:
              - heading "Career" [level=2] [ref=e271]
              - link "edit" [ref=e273] [cursor=pointer]:
                - /url: /w/index.php?title=Virgil_Abloh&action=edit&section=2
            - 'region "2009–2013: Rise to prominence" [ref=e274]':
              - generic [ref=e275]:
                - 'heading "2009–2013: Rise to prominence" [level=3] [ref=e276]'
                - link "edit" [ref=e278] [cursor=pointer]:
                  - /url: /w/index.php?title=Virgil_Abloh&action=edit&section=3
              - paragraph [ref=e279]:
                - text: After getting his architecture degree, Abloh
                - link "interned" [ref=e280] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Intern
                - text: at
                - link "Fendi" [ref=e281] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fendi
                - text: in the same class as rapper
                - link "Kanye West" [ref=e282] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kanye_West
                - text: in 2009.
                - superscript [ref=e283]:
                  - link "[7]" [ref=e284] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: Placed in the company's Rome, Italy office, the two began a collaborative relationship.
                - superscript [ref=e286]:
                  - link "[7]" [ref=e287] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: During his work with the rapper and designer, Abloh caught the eye of the Louis Vuitton
                - link "CEO" [ref=e289] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CEO
                - text: ", Michael Burke."
                - superscript [ref=e290]:
                  - link "[7]" [ref=e291] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: Later that year, Abloh and West's artistic partner,
                - link "Don C" [ref=e293] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Don_C
                - text: ", launched a retail store, called the RSVP Gallery,"
                - superscript [ref=e294]:
                  - link "[14]" [ref=e295] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - text: located in Chicago.
                - superscript [ref=e297]:
                  - link "[7]" [ref=e298] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: The store became known for carrying a mixture of fashion apparel, and for its reflection of Abloh's style on his design for the store interior.
                - superscript [ref=e300]:
                  - link "[7]" [ref=e301] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: A year later, West appointed Abloh the
                - link "creative director" [ref=e303] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Creative_director
                - text: of his
                - link "creative agency" [ref=e304] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Advertising_agency
                - text: ","
                - link "Donda" [ref=e305] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Donda_(company)
                - text: .
                - superscript [ref=e306]:
                  - link "[7]" [ref=e307] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
              - paragraph [ref=e309]:
                - text: In 2011 West asked him to serve as the
                - link "artistic director" [ref=e310] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Art_director
                - text: for his 2011 collaborative album with
                - link "Jay-Z" [ref=e311] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jay-Z
                - link "Watch the Throne" [ref=e313] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Watch_the_Throne
                - text: ", earning the designer a"
                - link "Grammy" [ref=e314] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Grammy_Awards
                - text: nomination.
                - superscript [ref=e315]:
                  - link "[7]" [ref=e316] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: In 2012, Abloh designed the cover art for
                - link "WZRD" [ref=e318] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WZRD_(band)
                - text: "'s"
                - link "self-titled debut" [ref=e319] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WZRD_(album)
                - text: .
                - superscript [ref=e320]:
                  - link "[15]" [ref=e321] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - text: In 2012, Abloh launched his first company, Pyrex Vision.
                - superscript [ref=e323]:
                  - link "[7]" [ref=e324] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: He purchased
                - link "deadstock" [ref=e326] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vintage_clothing#Deadstock
                - text: clothing from
                - link "Ralph Lauren" [ref=e327] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Polo_Ralph_Lauren
                - text: for $40, screen-printed designs on them and sold them for prices upward of $550.
                - superscript [ref=e328]:
                  - link "[7]" [ref=e329] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: He closed the company down a year later as he did not intend it to be a commercial enterprise, but an artistic experiment.
                - superscript [ref=e331]:
                  - link "[7]" [ref=e332] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
            - 'region "2013–2017: Off-White and mainstream success" [ref=e334]':
              - generic [ref=e335]:
                - 'heading "2013–2017: Off-White and mainstream success" [level=3] [ref=e336]'
                - link "edit" [ref=e338] [cursor=pointer]:
                  - /url: /w/index.php?title=Virgil_Abloh&action=edit&section=4
              - generic [ref=e339]:
                - blockquote [ref=e340]:
                  - paragraph [ref=e341]:
                    - text: In a large part
                    - link "streetwear" [ref=e342] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Streetwear
                    - text: is seen as cheap. What my goal has been is to add an intellectual layer to it and make it credible.
                - generic [ref=e344]:
                  - text: — Abloh on the inspiration behind founding
                  - link "high-end" [ref=e345] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Haute_couture
                  - text: streetwear label,
                  - link "Off-White" [ref=e346] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Off-White_(company)
                  - text: .
                  - superscript [ref=e347]:
